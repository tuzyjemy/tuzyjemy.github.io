<nav class="breadcrumb" aria-label="breadcrumb">
  <a href="{{ "" | relLangURL }}">{{ i18n "home" }}</a>
  {{ $collection := partial "collection-for.html" . }}
  {{ if $collection }}
    {{ with .Site.GetPage (printf "/%s" $collection) }}
      <span aria-hidden="true">/</span><a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ end }}
  {{ else }}
    {{ with .Parent }}{{ if not .IsHome }}
      <span aria-hidden="true">/</span><a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ end }}{{ end }}
  {{ end }}
  <span aria-hidden="true">/</span>
  <span>{{ .Title }}</span>
</nav>
