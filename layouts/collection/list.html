{{ define "main" }}
<div class="shell">
  <header class="page-head">
    <h1>{{ .Title }}</h1>
    <p class="lead">{{ .Description }}</p>
  </header>
  {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
  {{ $pages := partial "collection-pages.html" (dict "collection" .Section "ctx" .) }}
  {{ partial "doc-list.html" (dict "pages" $pages "ctx" .) }}
</div>
{{ end }}
