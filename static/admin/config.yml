        i18n: true
        fields:
          - { name: title, label: Tytuł, widget: string, i18n: true }
          - { name: description, label: Opis (lead i meta), widget: text, required: false, i18n: true }
          - { name: date, label: Data publikacji, widget: datetime, date_format: YYYY-MM-DD, time_format: false, i18n: duplicate }
          - { name: body, label: Treść, widget: markdown, i18n: true }


  # =========================================================== OPISY SEKCJI
  # Pliki _index.<język>.md — tekst nad listą wpisów. W kolekcjach z wpisami
