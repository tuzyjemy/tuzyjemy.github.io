          - { name: date, label: Data publikacji, widget: datetime, date_format: YYYY-MM-DD, time_format: false, i18n: duplicate }
          - { name: lastmod, label: Data aktualizacji, widget: datetime, required: false, date_format: YYYY-MM-DD, time_format: false, i18n: duplicate }
          - { name: tematy, label: Tematy, widget: list, required: false, i18n: duplicate }
          - { name: lata, label: Lata, widget: list, required: false, i18n: duplicate }
          - { name: autor, label: Autor, widget: string, required: false, default: Zespół Tu Żyjemy, i18n: duplicate }
          - { name: body, label: Treść, widget: markdown, i18n: true }

      - name: zasady
