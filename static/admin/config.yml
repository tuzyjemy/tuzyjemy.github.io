    create: true
    slug: '{{fields._slug}}'
    filter: { field: title, pattern: '.' }
    fields:
      - { name: title, label: Tytuł, widget: string }
      - { name: description, label: Opis (lead i meta), widget: text, required: false }
      - { name: date, label: Data publikacji, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { name: tematy, label: Tematy, widget: list, required: false }
      - { name: instytucje, label: Instytucje, widget: list, required: false }
      - { name: lata, label: Lata, widget: list, required: false }
      - { name: zrodlo, label: Źródło (adres), widget: string, required: false }
