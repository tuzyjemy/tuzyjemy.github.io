          - { name: body, label: Treść, widget: markdown, i18n: true }

      - name: dzialania
        label: Co zrobiliśmy
        file: content/{{locale}}/dzialania/_index.md
        i18n: true
        fields:
          - { name: title, label: Tytuł, widget: string, i18n: true }
          - { name: description, label: Opis (lead i meta), widget: text, required: false, i18n: true }
          - { name: body, label: Treść, widget: markdown, i18n: true }

      - name: orzeczenia
        label: Orzeczenia
        file: content/{{locale}}/orzeczenia/_index.md
        i18n: true
        fields:
          - { name: title, label: Tytuł, widget: string, i18n: true }
          - { name: description, label: Opis (lead i meta), widget: text, required: false, i18n: true }
          - { name: body, label: Treść, widget: markdown, i18n: true }

      - name: statystyki
        label: Statystyki
        file: content/{{locale}}/statystyki/_index.md
        i18n: true
        fields:
          - { name: title, label: Tytuł, widget: string, i18n: true }
          - { name: description, label: Opis (lead i meta), widget: text, required: false, i18n: true }
          - { name: body, label: Treść, widget: markdown, i18n: true }

      - name: odpowiedzi
        label: Odpowiedzi instytucji
        file: content/{{locale}}/odpowiedzi/_index.md
        i18n: true
        fields:
          - { name: title, label: Tytuł, widget: string, i18n: true }
          - { name: description, label: Opis (lead i meta), widget: text, required: false, i18n: true }
          - { name: body, label: Treść, widget: markdown, i18n: true }


  # =========================================================== SEKCJE Z WPISAMI
  # Osobna kolekcja na język (patrz uwaga o układzie języków na górze pliku).
  # Ułożone sekcjami, więc wszystkie języki jednej sekcji stoją obok siebie.
  # Pliki _index.md są odfiltrowane — opisy sekcji edytuje się wyżej.

