<text x="1200.0" y="1633.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#183249">Dane z wniosków MOS muszą trafić do systemów Cudzoziemcy i POBYT</text>
<text x="1200.0" y="1677.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="33" font-weight="400" fill="#486277">Niebieska linia przerywana: należy ustalić, czy import danych jest automatyczny.</text>
<text x="1200" y="1785" text-anchor="middle" font-family="Arial, sans-serif" font-size="33" font-weight="400" fill="#9D581B">Pomarańczowa linia przerywana — aktualne kierunki cyfryzacji Pomorskiego Urzędu Wojewódzkiego.</text>
<text x="1200" y="1865" text-anchor="middle" font-family="Arial, sans-serif" font-size="35" font-weight="400" fill="#B3261E">Uproszczony schemat roboczy na podstawie spotkań — będzie doprecyzowywany</text>
<text x="1200" y="1915" text-anchor="middle" font-family="Arial, sans-serif" font-size="35" font-weight="400" fill="#B3261E">i uzupełniany w toku dalszej współpracy z urzędem.</text>
