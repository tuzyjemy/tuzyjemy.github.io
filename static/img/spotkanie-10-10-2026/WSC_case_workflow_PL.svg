<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1980" viewBox="0 0 2000 1980" role="img" aria-label="Od wniosku do decyzji — schemat roboczy WSC PUW">
<title>Od wniosku do decyzji — schemat roboczy WSC PUW</title>
<rect width="2000" height="1980" fill="#F7F9FC"/>
<text x="1000" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="57" font-weight="700" fill="#183249">Od wniosku do decyzji</text>
<text x="1000" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="400" fill="#486277">WSC PUW · schemat roboczy do dalszej weryfikacji z inspektorami</text>
<rect x="130" y="215" width="735" height="140" rx="20" fill="white" stroke="#6B849C" stroke-width="3"/>
<text x="497.5" y="255.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#183249">Wcześniejsze wnioski papierowe</text>
<text x="497.5" y="295.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#486277">Większość materiałów w aktach papierowych;</text>
<text x="497.5" y="334.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#486277">w EZD najczęściej pierwsza strona wniosku</text>
<rect x="1135" y="215" width="735" height="140" rx="20" fill="white" stroke="#6B849C" stroke-width="3"/>
<text x="1502.5" y="276.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#183249">Wnioski składane przez MOS</text>
<text x="1502.5" y="315.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#486277">Złożenie elektroniczne → automatyczny import do EZD</text>
<polyline points="498,355 498,403 1502,403 1502,355" fill="none" stroke="#6B849C" stroke-width="4"/>
<polyline points="1000,403 1000,440" fill="none" stroke="#6B849C" stroke-width="4"/>
<polygon points="1000,440 990.8909147665202,423.32593132408294 1009.1090852334798,423.32593132408294" fill="#6B849C"/>
<rect x="650" y="440" width="700" height="115" rx="20" fill="white" stroke="#6B849C" stroke-width="3"/>
<text x="1000.0" y="486.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#183249">Rejestracja wniosku</text>
<text x="1000.0" y="529.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#486277">Ewidencja wniosku i dokumentów sprawy</text>
<polyline points="1000,555 1000,605" fill="none" stroke="#6B849C" stroke-width="4"/>
<polygon points="1000,605 990.8909147665202,588.325931324083 1009.1090852334798,588.325931324083" fill="#6B849C"/>
<rect x="650" y="605" width="700" height="200" rx="20" fill="white" stroke="#6B849C" stroke-width="3"/>
<text x="1000.0" y="653.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#183249">Wezwanie na odciski palców</text>
<text x="1000.0" y="695.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#486277">Pełny komplet dokumentów</text>
<text x="1000.0" y="736.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#486277">Paszport · zdjęcia · opłata · odciski palców</text>
<text x="1000.0" y="777.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#486277">Załącznik nr 1 — gdy jest wymagany</text>
<polyline points="1000,805 1000,855" fill="none" stroke="#6B849C" stroke-width="4"/>
<polygon points="1000,855 990.8909147665202,838.325931324083 1009.1090852334798,838.325931324083" fill="#6B849C"/>
<rect x="650" y="855" width="700" height="140" rx="20" fill="white" stroke="#6B849C" stroke-width="3"/>
<text x="1000.0" y="894.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#183249">Opiniowanie</text>
<text x="1000.0" y="936.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#486277">Zapytania do Policji, Straży Granicznej i ABW</text>
<text x="1000.0" y="976.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#486277">Zależnie od rodzaju zezwolenia</text>
<polyline points="1000,995 1000,1045" fill="none" stroke="#6B849C" stroke-width="4"/>
<polygon points="1000,1045 990.8909147665202,1028.3259313240828 1009.1090852334798,1028.3259313240828" fill="#6B849C"/>
<rect x="650" y="1045" width="700" height="130" rx="20" fill="#EDF4FC" stroke="#6B849C" stroke-width="3"/>
<text x="1000.0" y="1098.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#183249">Kolejka do rozpatrzenia merytorycznego</text>
<text x="1000.0" y="1138.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="400" fill="#486277">Oczekiwanie na przekazanie inspektorowi</text>
<rect x="590" y="1225" width="1360" height="565" rx="26" fill="#EDF4FC" stroke="#AFC5D8" stroke-width="2"/>
<text x="1450" y="1266" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#236493">ODRĘBNA KOLEJKA SPRAW MERYTORYCZNYCH</text>
<polyline points="1000,1175 1000,1310" fill="none" stroke="#6B849C" stroke-width="4"/>
<polygon points="1000,1310 990.8909147665202,1293.3259313240828 1009.1090852334798,1293.3259313240828" fill="#6B849C"/>
<rect x="650" y="1310" width="700" height="150" rx="20" fill="white" stroke="#6B849C" stroke-width="3"/>
<text x="1000.0" y="1357.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#183249">Weryfikacja przez inspektora</text>
<text x="1000.0" y="1397.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#486277">Podstawa pobytu · aktualne dokumenty</text>
<text x="1000.0" y="1434.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#486277">Dochód / praca / ubezpieczenie — zależnie od sprawy</text>
<polyline points="1000,1460 1000,1495" fill="none" stroke="#6B849C" stroke-width="4"/>
<polygon points="1000,1495 990.8909147665202,1478.3259313240828 1009.1090852334798,1478.3259313240828" fill="#6B849C"/>
<polygon points="1000,1495 1330,1575 1000,1655 670,1575" fill="#EAF1F8" stroke="#6B849C" stroke-width="3"/>
<text x="1000" y="1561" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#183249">Potrzebne dalsze</text>
<text x="1000" y="1603" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#183249">dokumenty?</text>
<polyline points="1330,1575 1440,1575" fill="none" stroke="#6B849C" stroke-width="4"/>
<polygon points="1440,1575 1423.3259313240828,1584.1090852334798 1423.3259313240828,1565.8909147665202" fill="#6B849C"/>
<text x="1390" y="1548" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#236493">Tak</text>
<rect x="1440" y="1475" width="450" height="240" rx="20" fill="white" stroke="#6B849C" stroke-width="3"/>
<text x="1665.0" y="1508.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#183249">Wezwanie inspektora</text>
<text x="1665.0" y="1546.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#486277">Uzupełnienie braków</text>
<text x="1665.0" y="1584.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#486277">merytorycznych</text>
<text x="1665.0" y="1622.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#486277">Wnioskodawca dosyła pełny,</text>
<text x="1665.0" y="1660.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#486277">aktualny komplet dokumentów</text>
<text x="1665.0" y="1698.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#486277">zgodnie z otrzymaną listą</text>
<polyline points="1890,1595 1920,1595 1920,1385 1350,1385" fill="none" stroke="#236493" stroke-width="4"/>
<polygon points="1350,1385 1366.6740686759172,1375.8909147665202 1366.6740686759172,1394.1090852334798" fill="#236493"/>
<polyline points="1000,1655 1000,1710" fill="none" stroke="#6B849C" stroke-width="4"/>
<polygon points="1000,1710 990.8909147665202,1693.3259313240828 1009.1090852334798,1693.3259313240828" fill="#6B849C"/>
<text x="1070" y="1690" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#236493">Nie</text>
<rect x="650" y="1710" width="700" height="65" rx="20" fill="#E6F1ED" stroke="#23694F" stroke-width="3"/>
<text x="1000.0" y="1751.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#183249">Decyzja w sprawie</text>
<rect x="80" y="1460" width="440" height="275" rx="20" fill="#FFF4E8" stroke="#9D581B" stroke-width="3"/>
<text x="300.0" y="1505.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#183249">Orientacyjnie: do miesiąca</text>
<text x="300.0" y="1543.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#486277">Po pełnym uzupełnieniu</text>
<text x="300.0" y="1581.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#486277">braków merytorycznych —</text>
<text x="300.0" y="1619.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#486277">według Pani Dyrektor.</text>
<text x="300.0" y="1663.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#486277"></text>
<text x="300.0" y="1669.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#486277">To szacunek,</text>
<text x="300.0" y="1705.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#486277">a nie gwarantowany termin.</text>
<text x="1000" y="1880" text-anchor="middle" font-family="Arial, sans-serif" font-size="33" font-weight="400" fill="#B3261E">Uproszczony schemat roboczy na podstawie spotkań — będzie doprecyzowywany</text>
<text x="1000" y="1930" text-anchor="middle" font-family="Arial, sans-serif" font-size="33" font-weight="400" fill="#B3261E">i uzupełniany w toku dalszej współpracy z urzędem.</text>
</svg>