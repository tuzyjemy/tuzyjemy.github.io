# ---------------------------------------------------------------------------
# Menu — te same identyfikatory sekcji we wszystkich językach.
# Tytuły pochodzą z plików i18n/*.toml
# ---------------------------------------------------------------------------
#
# Kolejność (wagi) odzwierciedla grupowanie z data/menugroups.yaml:
# najpierw sekcje dla każdego (10-30), potem te dla przygotowujących
# się do działania (40-50), na końcu dokumentacja/orzecznictwo (60-70).
[menus]
  [[menus.main]]
    identifier = "aktualnosci"
    pageRef = "/aktualnosci"
    weight = 10
  [[menus.main]]
    identifier = "statystyki"
    pageRef = "/statystyki"
    weight = 20
  [[menus.main]]
    identifier = "skutki"
    pageRef = "/skutki"
    weight = 25
  [[menus.main]]
    identifier = "dzialania"
    pageRef = "/dzialania"
    weight = 30
  [[menus.main]]
    identifier = "wzory"
    pageRef = "/wzory"
    weight = 40
  [[menus.main]]
    identifier = "poradniki"
    pageRef = "/poradniki"
    weight = 50
  [[menus.main]]
    identifier = "orzeczenia"
    pageRef = "/orzeczenia"
    weight = 60
  [[menus.main]]
    identifier = "odpowiedzi"
    pageRef = "/odpowiedzi"
    weight = 70
