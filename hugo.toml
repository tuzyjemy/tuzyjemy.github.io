baseURL = "https://tuzyjemy.pl/"
title = "Tu Żyjemy"
defaultContentLanguage = "pl"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
removePathAccents = true
capitalizeListTitles = false
enableGitInfo = false
timeZone = "Europe/Warsaw"
summaryLength = 30

# Wyłącz sekcję taksonomii, jeśli nie jest potrzebna. Na razie wszystko włączone.
[pagination]
  pagerSize = 12

[taxonomies]
  instytucja = "instytucje"
  temat = "tematy"
  status = "statusy"
  rok = "lata"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
  [markup.highlight]
    noClasses = false
    style = "github"

# Dodatkowy format „plain": uproszczona wersja dokumentu zawierająca
# wyłącznie treść do przetłumaczenia — bez nawigacji, filtrów i stopki.
# To na nią kierują odnośniki do Tłumacza Google: pełna strona tłumaczy
# się źle, bo tłumacz gubi układ, a elementy interfejsu tylko przeszkadzają.
[outputFormats]
  [outputFormats.plain]
    mediaType = "text/html"
    baseName = "plain"
    isHTML = true
    permalinkable = true

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page = ["HTML", "plain"]

# ---------------------------------------------------------------------------
# Parametry globalne
# ---------------------------------------------------------------------------
[params]
  # Zmień na własne dane przed publikacją.
  telegram = "https://t.me/tu_zyjemy"
  email = "contact@tuzyjemy.pl"
  # Wydarzenie, na które zbieramy zgłoszenia, ustawia się w
  # data/campaign/layout.yaml (klucz „event").
  # Adres zewnętrznego formularza (np. Framaforms / CryptPad / Google Forms).
  formularzHistorii = ""
  formularzOrganizacji = ""
  # Ile wpisów pokazywać na stronie głównej
  liczbaWydarzen = 4
  liczbaDzialan = 3
  liczbaAktualnosci = 3
  # Włącz, gdy repozytorium jest publiczne — dodaje link "edytuj tę stronę"
  repoEdycji = ""

# ---------------------------------------------------------------------------
# Języki
# ---------------------------------------------------------------------------
[languages]

  [languages.pl]
    languageCode = "pl-PL"
    languageName = "Polski"
    contentDir = "content/pl"
    weight = 1
    title = "Tu Żyjemy"
    [languages.pl.params]
      opis = "Baza wiedzy i wspólne działania na rzecz praw migrantek i migrantów."
    [languages.pl.permalinks.page]
      dzialania = "/dzialania/:contentbasename/"
      wzory = "/wzory/:contentbasename/"
      orzeczenia = "/orzeczenia/:contentbasename/"
