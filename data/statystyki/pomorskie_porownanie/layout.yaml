# Wspólne dane liczbowe dla artykułu porównującego Pomorskie, Małopolskie
# i Dolnośląskie. Teksty zależne od języka znajdują się w plikach pl.yaml,
# ru.yaml, en.yaml, uk.yaml i be.yaml w tym samym katalogu.
#
# Zmiana liczby, wyróżnienia albo koloru wymaga edycji tylko tego pliku.

official_wait:
  kind: official_wait
  years: [2023, 2024, 2025, 2026]
  rows:
    - region: malopolskie
      color: woj-malopolskie
      values: [128, 145, 183, 242]
      highlight: null
    - region: dolnoslaskie
      color: woj-dolnoslaskie
      values: [401, 472, 273, 303]
      highlight: 2025
    - region: pomorskie
      color: woj-pomorskie
      values: [314, 383, 544, 598]
      highlight: 2026

document_stock:
