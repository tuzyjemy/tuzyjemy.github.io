  rows:
    - label: dolnoslaskie
      value: 123281
      display: "123 281"
      color: woj-dolnoslaskie
    - label: malopolskie
      value: 109429
      display: "109 429"
      color: woj-malopolskie
    - label: pomorskie
      value: 59236
      display: "59 236"
