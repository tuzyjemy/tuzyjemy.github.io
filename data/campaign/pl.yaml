heading: "Nie chcemy czekać latami"
body: |-
  7 września wychodzimy pod Pomorski Urząd Wojewódzki. Nie występujemy przeciwko pracownikom urzędu — występujemy przeciwko systemowi, w którym państwo przyjmuje wniosek, pobiera opłatę, a potem zostawia człowieka bez decyzji na dwa albo trzy lata. Mamy 15 konkretnych postulatów.

  Na protest przygotowujemy też nową petycję — jej tekst opublikujemy wkrótce.
