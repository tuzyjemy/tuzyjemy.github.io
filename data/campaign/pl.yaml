heading: "Sprawna legalizacja pobytu — lepsza integracja"
body: |-
  Domagamy się terminowych, zgodnych z prawem decyzji w sprawach zezwoleń na pobyt czasowy, stały i rezydenta długoterminowego UE. Nie postulujemy zmian zasad nadawania polskiego obywatelstwa ani automatycznie pozytywnych decyzji. Państwo ma prawo dokładnie sprawdzać wnioski — powinno też rozstrzygać je w przewidywalnym terminie.

  Nie chcemy czekać latami na decyzję pobytową. 7 września wychodzimy pod Pomorski Urząd Wojewódzki z 16 konkretnymi postulatami.

