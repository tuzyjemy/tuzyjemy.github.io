
# Compact homepage copy; the original campaign details remain available below.
intro: "Jesteśmy oddolną inicjatywą obywatelską mieszkańców Polski. Łączymy doświadczenia mieszkańców z analizą danych, proponujemy zmiany i dzielimy się wiedzą, która pomaga działać."
meetingLabel: "Wyniki spotkania"
meetingTitle: "Legalizacja pobytu: ustalenia po spotkaniu z wicewojewodą"
meetingBody: "Rozpoczynamy współpracę z administracją nad aplikacją ułatwiającą przygotowanie dokumentów. Od października wzmocniony zostanie również zespół wydający zaświadczenia o toczącym się postępowaniu. Przedstawiamy ustalenia ze spotkania i kolejne kroki."
historySummary: "7 września: protest w Gdańsku i przekazanie petycji z 11 postulatami."
# Teksty kampanii — polski. Strukturę (wydarzenie, odnośniki) ustawia layout.yaml.
kicker: "PROTEST SIĘ ODBYŁ · CO DALEJ"
heading: "Tu Żyjemy — wspólne miejsce do wspólnego działania."
lead: "Postulujemy terminowe i zgodne z prawem wydawanie decyzji w sprawach zezwoleń na pobyt czasowy, pobyt stały i pobyt rezydenta długoterminowego UE."
boundary: "Nie postulujemy zmian zasad nadawania polskiego obywatelstwa ani automatycznie pozytywnych decyzji."
principle: "Państwo ma prawo dokładnie sprawdzać wnioski — powinno też rozstrzygać je w przewidywalnym terminie."
body: |-
  7 września pod Pomorski Urząd Wojewódzki przyszło ponad 200 osób. Petycja z 11 punktami trafiła do pierwszego wicewojewody, zapowiedziano nowe etaty w wydziale, ustalono spotkanie robocze.

  Problem nie zniknął: ludzie nadal czekają na decyzję po dwa lata i dłużej. Pilnujemy realizacji zapowiedzi i działamy dalej.

