body: |-
  Мы патрабуем своечасовых і законных рашэнняў у справах аб часовым і пастаянным знаходжанні, а таксама аб статусе доўгатэрміновага рэзідэнта ЕС. Мы не прапануем змяняць правілы надання польскага грамадзянства або аўтаматычна прымаць станоўчыя рашэнні. Дзяржава мае права старанна правяраць заявы — і павінна вырашаць іх у прадказальны тэрмін.

  Мы не хочам гадамі чакаць рашэння аб знаходжанні. 7 верасня выходзім да Паморскага ваяводскага ўпраўлення з 16 канкрэтнымі патрабаваннямі.

