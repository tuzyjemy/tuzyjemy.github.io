heading: "Мы не хочам чакаць гадамі"
body: |-
  7 верасня выходзім да Памор'скага ваяводскага ўпраўлення. Мы выступаем не супраць супрацоўнікаў — мы выступаем супраць сістэмы, у якой дзяржава прымае заяву, спаганяе мыта, а потым пакідае чалавека без рашэння на два ці тры гады. У нас 16 канкрэтных патрабаванняў.

  Да пратэсту мы таксама рыхтуем новую петыцыю — яе тэкст апублікуем пазней.

  У нас ёсць агульныя правілы ўдзелу — прачытайце іх ніжэй.

