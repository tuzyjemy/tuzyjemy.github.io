body: |-
  7 верасня да Паморскага ваяводскага ўпраўлення выйшлі больш за 200 чалавек. Петыцыя з 11 пунктамі перададзена першаму віцэваяводзе, абвешчаны новыя рабочыя месцы ў аддзеле, узгоднена рабочая сустрэча.

  Праблема не знікла: людзі па-ранейшаму чакаюць рашэння па два гады і даўжэй. Мы сочым за выкананнем абяцанняў і дзейнічаем далей.

