kicker: "ПРОТЕСТ СОСТОЯЛСЯ · ЧТО ДАЛЬШЕ"
heading: "Tu Żyjemy — общее место для общего дела."
lead: "Мы требуем своевременных и законных решений по заявлениям о выдаче разрешений на временное и постоянное пребывание, а также о предоставлении статуса долгосрочного резидента ЕС."
boundary: "Мы не предлагаем менять правила предоставления польского гражданства и не требуем автоматического одобрения заявлений."
principle: "Государство вправе тщательно проверять каждое заявление, но должно принимать решение в предсказуемый срок."
body: |-
  7 сентября к Поморскому воеводскому ужонду вышли более 200 человек. Петиция с 11 пунктами передана первому вицевоеводе, объявлено об увеличении штата отдела, согласована рабочая встреча.

  Проблема не решена: люди по-прежнему ждут решения по два года и дольше. Мы следим за выполнением обещаний и продолжаем действовать.

