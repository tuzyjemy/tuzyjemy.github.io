
# Compact homepage copy; the original campaign details remain available below.
intro: "Мы — гражданская инициатива жителей Польши. Мы объединяем опыт жителей с анализом данных, предлагаем изменения и делимся знаниями, которые помогают действовать."
meetingLabel: "Итоги встречи"
meetingTitle: "Легализация пребывания: договорённости по итогам встречи с вице-воеводой"
meetingBody: "Начинаем совместную работу с администрацией над приложением, которое упростит подготовку документов. С октября также будет усилена команда, выдающая справки о том, что дело находится на рассмотрении. Рассказываем о договорённостях и следующих шагах."
historySummary: "7 сентября: протест в Гданьске и передача петиции с 11 требованиями."
