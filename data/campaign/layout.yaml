# ---------------------------------------------------------------------------
# Struktura kampanii pokazywanej na górze strony głównej — definiowana RAZ
# dla wszystkich języków. Tłumaczenia leżą obok, w plikach pl.yaml, ru.yaml,
# en.yaml, uk.yaml i be.yaml; łączą się z tym plikiem przez pola „id".
#
# Tu trzymamy wyłącznie to, co nie zależy od języka: daty, odnośniki
# i przełączniki. Żadnych tekstów.
#
# Aby zakończyć kampanię, ustaw `active: false` — blok zniknie ze strony
# głównej, a tłumaczenia zostaną nietknięte na przyszłość.
# ---------------------------------------------------------------------------
active: true

# Dokument kampanii, na który prowadzi przycisk w bloku na górze strony.
link: "/postulaty/"

# Zasady udziału w zgromadzeniu — pokazujemy je przy przycisku „Przyjdę",
# czyli w miejscu, w którym ktoś decyduje, czy przyjść.
rules: "/zasady/"

# Wydarzenie w Mobilizon. Stąd bierze się przycisk „Przyjdę", a liczbę
# zgłoszonych uczestników pobieramy z publicznego API przy budowaniu
# strony (patrz event-attendance.html). API zwraca wyłącznie liczby —
# imiona i adresy zgłaszających widzi tylko organizator.
#
# Datę, godziny i miejsce wpisujemy tutaj, a nie pobieramy z API, żeby
# strona wyglądała poprawnie także wtedy, gdy Mobilizon akurat nie
# odpowiada. UWAGA: po zmianie terminu w Mobilizonie trzeba poprawić
# te wartości ręcznie.
#
# Dzień tygodnia i nazwę miesiąca wyliczamy z daty osobno dla każdego
# języka (data/dates.yaml) — nie trzeba ich tłumaczyć.
event:
  url: "https://mobilizon.fr/events/5e9e3d5d-90c4-409f-9e61-87de17584abe"
  date: "2026-09-07"
  timeStart: "16:30"
  timeEnd: "18:00"
  # Adres to nazwa własna — zostaje bez tłumaczenia we wszystkich językach.
  place: "Wydział do spraw cudzoziemców Pomorskiego UW"
  address: "ul. Chmielna 74/76, 80-748 Gdańsk"
  # Wpis w wykazie zgromadzeń publicznych Urzędu Miejskiego w Gdańsku.
  # Zgromadzenia się zgłasza, a nie „uzyskuje na nie zgodę" — miasto może
  # je najwyżej zakazać. Dlatego mówimy „zgłoszone", nie „zatwierdzone".
  registerUrl: "https://bip.gdansk.pl/urzad-miejski/zgromadzenia-publiczne/Data-07-09-2026r-Czas-trwania-16-30-18-00,a,317325"

# Karty „Możesz pomóc już teraz". Kolejność stąd decyduje o kolejności
# na stronie; teksty biorą się z plików językowych po tym samym „id".
calls:
  - id: share
    link: "/aktualnosci/protest-7-wrzesnia/"
    urgent: true
  - id: organisation
    link: "/dolacz/"
  - id: story
    link: "/statystyki/"
