
# Compact homepage copy; the original campaign details remain available below.
intro: "We are a grassroots civic initiative of people living in Poland. We combine residents’ experiences with data analysis, propose changes and share knowledge that helps people take action."
meetingLabel: "Upcoming meeting"
meetingTitle: "Talks on improving residence legalisation"
meetingBody: "A working meeting with the vice-voivode and the director of the Department for Foreigners to discuss improvements to the office’s work and ensure timely processing of residence cases. The proposals in our petition will form the basis for the discussion."
historySummary: "7 September: a protest in Gdańsk and a petition with 11 demands delivered to the vice-voivode."
# Campaign copy — English. Structure (dates, links) lives in layout.yaml.
kicker: "THE PROTEST TOOK PLACE · WHAT NEXT"
heading: "Tu Żyjemy — a shared place for shared action."
lead: "We call for timely, lawful decisions on temporary residence, permanent residence and EU long-term resident permits."
boundary: "We do not call for changes to the rules for granting Polish citizenship or automatically positive decisions."
principle: "The state has the right to examine applications thoroughly — and should decide them within a predictable time."
body: |-
  On 7 September more than 200 people came to the Pomeranian Voivodeship Office. A petition with 11 points was handed to the first vice-voivode, new posts were promised for the department, and a working meeting was agreed.

  The problem has not gone away: people still wait two years and longer for a decision. We are holding the office to its promises and carrying on.

