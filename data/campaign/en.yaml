# Campaign copy — English. Structure (dates, links) lives in layout.yaml.
kicker: "Residence legalisation · Gdańsk"
heading: "We do not want to wait for years"
body: |-
  On 7 September we gather outside the Pomeranian Voivodeship Office. We are not protesting against the staff — we are protesting against a system in which the state accepts an application, collects the fee, and then leaves a person without a decision for two or three years. We have 16 concrete demands.

  We are also preparing a new petition for the protest — its text will follow shortly.
