kicker: "Легалізація перебування · Ґданськ"
heading: "Ми не хочемо чекати роками"
body: |-
  7 вересня виходимо до Поморського воєводського управління. Ми виступаємо не проти працівників — ми виступаємо проти системи, в якій держава приймає заяву, стягує мито, а потім залишає людину без рішення на два або три роки. У нас 16 конкретних вимог.

  До протесту ми також готуємо нову петицію — її текст опублікуємо згодом.

  У нас є спільні правила участі — прочитайте їх нижче.

