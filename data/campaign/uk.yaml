heading: "Ефективна легалізація перебування — краща інтеграція"
body: |-
  Ми вимагаємо своєчасних і законних рішень у справах про тимчасове та постійне перебування, а також про статус довгострокового резидента ЄС. Ми не пропонуємо змінювати правила надання польського громадянства чи автоматично ухвалювати позитивні рішення. Держава має право ретельно перевіряти заяви — і повинна вирішувати їх у передбачуваний строк.

  Ми не хочемо роками чекати на рішення щодо перебування. 7 вересня виходимо до Поморського воєводського управління з 16 конкретними вимогами.

