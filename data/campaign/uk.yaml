
# Compact homepage copy; the original campaign details remain available below.
intro: "Ми — низова громадянська ініціатива мешканців Польщі. Поєднуємо досвід мешканців з аналізом даних, пропонуємо зміни й ділимося знаннями, які допомагають діяти."
meetingLabel: "Наступний крок · робоча зустріч"
meetingTitle: "19 жовтня — робоча зустріч із керівництвом та інспекторами відділу у справах іноземців Поморського воєводського управління"
meetingBody: "Команда Tu Żyjemy обговорить з інспекторами вимоги до застосунку та уточнить, як працює управління на кожному етапі розгляду заяви. Підготуємо пропозиції щодо вдосконалення процесу — від узгодженого розгляду справ сім’ї до спрямування частини працівників, які займаються CUKR, на розгляд інших справ."
historySummary: "7 вересня: протест у Ґданську та передача петиції з 11 вимогами."
# Тексти кампанії — українська. Структуру (дати, посилання) задає layout.yaml.
kicker: "ПРОТЕСТ ВІДБУВСЯ · ЩО ДАЛІ"
heading: "Tu Żyjemy — спільне місце для спільної дії."
lead: "Ми вимагаємо своєчасних і законних рішень у справах про тимчасове та постійне перебування, а також про статус довгострокового резидента ЄС."
boundary: "Ми не пропонуємо змінювати правила надання польського громадянства чи автоматично ухвалювати позитивні рішення."
principle: "Держава має право ретельно перевіряти заяви — і повинна вирішувати їх у передбачуваний строк."
body: |-
  7 вересня до Поморського воєводського управління вийшли понад 200 осіб. Петицію з 11 пунктами передано першому віцевоєводі, оголошено нові робочі місця у відділі, узгоджено робочу зустріч.

  Проблема не зникла: люди й далі чекають на рішення по два роки й довше. Ми стежимо за виконанням обіцянок і діємо далі.

