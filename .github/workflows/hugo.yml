name: Publikacja na GitHub Pages

on:
  push:
    branches: [main]
  # Co 6 godzin przebudowujemy stronę, żeby odświeżyć wyniki ankiety
  # pobierane z Framadate przy budowaniu (patrz poll-results.html).
  # Strona jest statyczna, więc bez tego wyniki zostałyby zamrożone
  # na chwili ostatniego wypchnięcia zmian.
  schedule:
    - cron: "0 * * * *"
  # Pozwala uruchomić publikację ręcznie z zakładki Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Jedna publikacja naraz. Trwające wdrożenia nie są przerywane.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Szablony używają hugo.Data i hugo.Sites — dostępne od Hugo 0.156.
      HUGO_VERSION: 0.165.0
    steps:
      - name: Instalacja Hugo (extended)
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Pobranie repozytorium
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Konfiguracja GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Budowanie strony
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          TZ: Europe/Warsaw
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Wysłanie artefaktu
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publikacja
        id: deployment
        uses: actions/deploy-pages@v4
