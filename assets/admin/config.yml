      - { name: zrodlo, label: Źródło (adres), widget: string, required: false, i18n: duplicate }
      - { name: body, label: Treść, widget: markdown, i18n: true }

  - name: wzory
    label: Wzory pism
    label_singular: Wzory pism
    publish: false
    folder: content/wzory
    create: true
    i18n: true
    slug: '{{ $SLUG }}'
    fields:
      - name: title
