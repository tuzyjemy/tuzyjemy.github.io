          - { name: description, label: Opis (lead i meta), widget: text, required: false, i18n: true }
          - { name: body, label: Treść, widget: markdown, i18n: true }

      - name: skutki
        label: Skutki
        file: content/skutki/_index.{{ $L }}.md
        i18n: true
        fields:
