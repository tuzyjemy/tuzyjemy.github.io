        widget: string
        i18n: true
        comment: 'Pole „Przyjazny link” powyżej to adres strony — wpisany tam `protest-7-wrzesnia` da /wzory/protest-7-wrzesnia/. Wpisz je po polsku; wielkie litery, polskie znaki i spacje poprawią się same.'
      - { name: description, label: Opis (lead i meta), widget: text, required: false, i18n: true }
