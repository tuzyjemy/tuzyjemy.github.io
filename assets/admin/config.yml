{{- /* UWAGA: ten plik jest szablonem Hugo — publikuje go partial
       cms-config.html jako /admin/config.yml.

       Sveltia ma własne znaczniki w podwójnych nawiasach ({{locale}},
       {{fields._slug}}), które Hugo próbowałby wykonać jako funkcje.
       Dlatego trzymamy je w zmiennych poniżej i wstawiamy przez $L / $SLUG.
       Dodając nowy znacznik Sveltii, zrób z nim to samo — inaczej budowanie
       padnie z błędem „function ... not defined”. */ -}}
{{- $L := "{{locale}}" -}}
{{- $SLUG := "{{fields._slug}}" -}}
# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS — panel redakcyjny tuzyjemy.pl
# ---------------------------------------------------------------------------
# Panel działa pod /admin/. Zapis tworzy gałąź i pull request; na main nic nie
# trafia bez akceptacji człowieka (patrz `publish_mode` niżej).
#
# LOGOWANIE. Strona stoi na GitHub Pages, więc nie ma serwera do obsługi
# OAuth — logujemy się osobistym tokenem (przycisk „Sign In with Token”).
# Token wolontariuszy należy do konta z rolą „write”, które nie może obejść
# reguł gałęzi main: może założyć gałąź i PR, ale nie scalić.
#
# UKŁAD JĘZYKÓW. Treść leży w jednym drzewie, a język jest w nazwie pliku:
#   content/publikacje/protest.pl.md, protest.ru.md, protest.en.md, …
# To natywny układ Hugo (bez `contentDir` per język) i zarazem struktura
# `multiple_files` Sveltii — dzięki temu KAŻDA kolekcja ma zakładki
# językowe: jeden wpis, pięć plików, zapisywane razem.
# ---------------------------------------------------------------------------

backend:
  name: github
  repo: tuzyjemy/tuzyjemy.github.io
  branch: main
  # Commity jednego wpisu scalają się w jeden — historia main zostaje czytelna.
  squash_merges: true
  # Domyślny przycisk „Zaloguj przez GitHuba” prowadzi przez pośrednika OAuth
  # Netlify, którego ta strona nie ma (kończy się błędem „Not Found”).
  auth_methods: [token]
  # Repozytorium jest publiczne — wystarczy wąski zakres `public_repo`
  # zamiast domyślnego `repo`, który sięga też repozytoriów prywatnych.
  auth_scope: public_repo

site_url: https://tuzyjemy.pl

# Hugo zdejmuje przedrostek `static/`, więc adres publiczny go nie zawiera.
media_folder: static/img
public_folder: /img

i18n:
  # Język w nazwie pliku: <nazwa>.<język>.md
  structure: multiple_files
  locales: [pl, ru, en, uk, be]
  default_locale: pl
  # Które języki są włączone od razu w nowym wpisie. Sveltia wymaga
  # wypełnienia pól obowiązkowych we WSZYSTKICH włączonych językach, więc
  # startujemy z samym `pl` — kolejne języki redaktor włącza w edytorze
  # (menu z trzema kropkami), gdy tłumaczenie jest gotowe.
  initial_locales: [pl]

# Jak powstaje „przyjazny link" (slug), niezależnie od tego, co ktoś wpisze:
# polskie znaki są zamieniane na łacińskie, wielkie litery na małe,
# spacje na myślniki. „Zaświadczenie o pobycie” → „zaswiadczenie-o-pobycie”.
slug:
  encoding: ascii
  clean_accents: true
  lowercase: true
  sanitize_replacement: '-'

publish_mode: editorial_workflow

# Każda kolekcja ma `publish: false`: w panelu nie ma przycisku „Opublikuj”.
# Redaktor przesuwa wpis do statusu „Gotowe”, a pull request akceptuje
# i scala człowiek na GitHubie — tam widać pełny diff.

collections:

  # A single logo list serves every language version of the homepage.
  - name: supporters
    label: Popierają nas — logotypy
    publish: false
    i18n: false
    files:
      - name: supporters
        label: Firmy i organizacje
        file: data/supporters.yaml
        fields:
          - name: items
            label: Popierające firmy i organizacje
            widget: list
            fields:
              - { name: name, label: Pełna nazwa, widget: string }
              - { name: url, label: Strona internetowa, widget: string }
              - { name: logo, label: Logotyp, widget: image }
              - name: scope
                label: Zakres poparcia
                widget: select
                required: false
                options:
                  - { label: Protest 7.09.2026, value: protest_2026_09_07 }

  # =========================================================== PIASKOWNICA
  # Sekcja do ćwiczenia obiegu redakcyjnego. Nie trafia do menu, list, RSS-a
  # ani mapy strony (patrz `cascade` w content/piaskownica/_index.pl.md).
  - name: piaskownica
    label: Piaskownica (testy)
    label_singular: Wpis testowy
    publish: false
    folder: content/piaskownica
    create: true
    i18n: true
    slug: '{{ $SLUG }}'
    fields:
      - name: title
        label: Tytuł
        widget: string
        i18n: true
      - { name: description, label: Opis (lead i meta), widget: text, required: false, i18n: true }
      - { name: date, label: Data publikacji, widget: datetime, date_format: YYYY-MM-DD, time_format: false, i18n: duplicate }
      - { name: body, label: Treść, widget: markdown, i18n: true }


  - divider: true

  # =========================================================== KAMPANIA
  - name: kampania
    label: Kampania na stronie głównej
    label_singular: Kampania
    publish: false
    i18n: true
    files:
      - name: uklad
        label: Układ i wydarzenie (bez tekstów)
        file: data/campaign/layout.yaml
        description: >-
          Daty, godziny, adresy i przełączniki. Teksty są w osobnym wpisie,
          żeby zmiana terminu nie wymagała ruszania pięciu tłumaczeń.
        fields:
          - { name: active, label: Kampania aktywna, widget: boolean, default: true }
          - { name: link, label: Dokument kampanii (ścieżka), widget: string }
          - { name: rules, label: Zasady udziału (ścieżka), widget: string, required: false }
          - name: meeting
            label: Spotkanie robocze (bez zapisów)
            widget: object
            required: false
            fields:
              - { name: date, label: Data, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
              - { name: link, label: Publikacja o spotkaniu (ścieżka), widget: string, required: false }
          - name: event
            label: Wydarzenie
            widget: object
            required: false
            fields:
              - { name: url, label: Adres w Mobilizonie, widget: string }
              - { name: date, label: Data, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
              - { name: timeStart, label: Godzina rozpoczęcia, widget: string }
              - { name: timeEnd, label: Godzina zakończenia, widget: string, required: false }
              - { name: place, label: Miejsce, widget: string }
              - { name: address, label: Adres, widget: string }
              - { name: registerUrl, label: Wpis w wykazie zgromadzeń (BIP), widget: string, required: false }
          - name: calls
            label: Karty „Wspólnie możemy więcej”
            widget: list
            fields:
              - { name: id, label: Identyfikator (łączy z tekstami), widget: string }
              - { name: link, label: Odnośnik, widget: string }
              - { name: urgent, label: Pilne, widget: boolean, required: false, default: false }

      - name: teksty
        label: Teksty kampanii
        file: data/campaign/{{ $L }}.yaml
        i18n: true
        fields:
          - { name: kicker, label: Nadtytuł, widget: string, required: false, i18n: true }
          - { name: heading, label: Nagłówek, widget: string, i18n: true }
          - { name: intro, label: Krótkie wprowadzenie, widget: text, required: false, i18n: true }
          - { name: meetingLabel, label: Spotkanie — etykieta, widget: string, required: false, i18n: true }
          - { name: meetingTitle, label: Spotkanie — tytuł, widget: string, required: false, i18n: true }
          - { name: meetingBody, label: Spotkanie — opis, widget: text, required: false, i18n: true }
          - { name: historySummary, label: Krótkie podsumowanie protestu, widget: text, required: false, i18n: true }
          - { name: body, label: Opis (pusty wiersz dzieli akapity), widget: text, i18n: true }
          - { name: linkTitle, label: Napis na przycisku, widget: string, required: false, i18n: true }
          - { name: meta, label: Wiersz z terminem i miejscem, widget: list, required: false, i18n: true }
          - { name: voteHeading, label: Panel zgłoszeń — nagłówek, widget: string, required: false, i18n: true }
          - { name: voteBody, label: Panel zgłoszeń — opis, widget: text, required: false, i18n: true }
          - name: calls
            label: Teksty kart
            widget: object
            i18n: true
            fields:

              - name: volunteer
                label: Karta dla wolontariuszy
                widget: object
                i18n: true
                fields:
                  - { name: status, label: Status, widget: string, required: false, i18n: true }
                  - { name: title, label: Tytuł, widget: string, i18n: true }
                  - { name: body, label: Opis, widget: text, i18n: true }
                  - { name: linkTitle, label: Napis na odnośniku, widget: string, required: false, i18n: true }

              - name: organisation
                label: Karta dla organizacji
                widget: object
                i18n: true
                fields:
                  - { name: status, label: Status, widget: string, required: false, i18n: true }
                  - { name: title, label: Tytuł, widget: string, i18n: true }
                  - { name: body, label: Opis, widget: text, i18n: true }
                  - { name: linkTitle, label: Napis na odnośniku, widget: string, required: false, i18n: true }

              - name: story
                label: Karta „dane”
                widget: object
                i18n: true
                fields:
                  - { name: status, label: Status, widget: string, required: false, i18n: true }
                  - { name: title, label: Tytuł, widget: string, i18n: true }
                  - { name: body, label: Opis, widget: text, i18n: true }
                  - { name: linkTitle, label: Napis na odnośniku, widget: string, required: false, i18n: true }


  # =========================================================== STRONY STAŁE
  - name: strony
    label: Strony stałe
    label_singular: Strona
    publish: false
    i18n: true
    files:

      - name: o-nas
        label: O nas
        file: content/o-nas.{{ $L }}.md
        i18n: true
        fields:
          - { name: title, label: Tytuł, widget: string, i18n: true }
          - { name: url, label: Adres, widget: string, i18n: true }
          - { name: lastmod, label: Data aktualizacji, widget: datetime, required: false, date_format: YYYY-MM-DD, time_format: false, i18n: duplicate }
          - { name: body, label: Treść, widget: markdown, i18n: true }

      - name: home
        label: Strona główna (tekst pod kafelkami)
        file: content/_index.{{ $L }}.md
        i18n: true
        fields:
          - { name: title, label: Tytuł, widget: string, i18n: true }
          - { name: description, label: Opis (lead i meta), widget: text, required: false, i18n: true }
          - { name: body, label: Treść, widget: markdown, i18n: true }

      - name: dolacz
        label: Działaj z nami
        file: content/dolacz.{{ $L }}.md
        i18n: true
        fields:
          - { name: title, label: Tytuł, widget: string, i18n: true }
          - { name: description, label: Opis (lead i meta), widget: text, required: false, i18n: true }
          - { name: date, label: Data publikacji, widget: datetime, date_format: YYYY-MM-DD, time_format: false, i18n: duplicate }
          - { name: body, label: Treść, widget: markdown, i18n: true }


  # =========================================================== OPISY SEKCJI
  # Pliki _index.<język>.md — tekst nad listą wpisów. W kolekcjach z wpisami
  # są ukryte, więc edytuje się je tutaj.
  - name: opisy_sekcji
    label: Opisy sekcji
    label_singular: Opis sekcji
    publish: false
    i18n: true
    files:

      - name: pomoc
        label: Poradniki i wzory
        file: content/pomoc/_index.{{ $L }}.md
        i18n: true
        fields:
          - { name: title, label: Tytuł, widget: string, i18n: true }
          - { name: description, label: Opis, widget: text, i18n: true }
          - { name: url, label: Adres, widget: string, i18n: true }
          - { name: type, widget: hidden, default: collection, i18n: duplicate }
          - { name: body, label: Treść, widget: markdown, required: false, i18n: true }

      - name: publikacje
        label: Publikacje
        file: content/publikacje/_index.{{ $L }}.md
        i18n: true
        fields:
          - { name: title, label: Tytuł, widget: string, i18n: true }
          - { name: description, label: Opis, widget: text, i18n: true }
          - { name: url, label: Adres, widget: string, i18n: true }
          - { name: type, widget: hidden, default: collection, i18n: duplicate }
          - { name: body, label: Treść, widget: markdown, required: false, i18n: true }

      - name: wzory
        label: Wzory pism
        file: content/wzory/_index.{{ $L }}.md
        i18n: true
        fields:
          - { name: title, label: Tytuł, widget: string, i18n: true }
          - { name: description, label: Opis (lead i meta), widget: text, required: false, i18n: true }
          - { name: body, label: Treść, widget: markdown, i18n: true }

      - name: poradniki
        label: Poradniki
        file: content/poradniki/_index.{{ $L }}.md
        i18n: true
        fields:
          - { name: title, label: Tytuł, widget: string, i18n: true }
          - { name: description, label: Opis (lead i meta), widget: text, required: false, i18n: true }
          - { name: body, label: Treść, widget: markdown, i18n: true }

      - name: orzeczenia
        label: Orzeczenia
        file: content/orzeczenia/_index.{{ $L }}.md
        i18n: true
        fields:
          - { name: title, label: Tytuł, widget: string, i18n: true }
          - { name: description, label: Opis (lead i meta), widget: text, required: false, i18n: true }
          - { name: body, label: Treść, widget: markdown, i18n: true }

  - name: publikacje
    label: Publikacje
    label_singular: Publikacja
    publish: false
    folder: content/publikacje
    create: true
    i18n: true
    slug: '{{ $SLUG }}'
    fields:
      - name: material_kind
        label: Rodzaj publikacji
        widget: select
        default: aktualnosci
        i18n: duplicate
        options:
          - { label: Aktualności, value: aktualnosci }
          - { label: Działania, value: dzialania }
          - { label: Odpowiedzi instytucji, value: odpowiedzi }
          - { label: Analizy i statystyki, value: statystyki }
          - { label: Skutki, value: skutki }
      - { name: linked_action, label: Powiązane działanie, hint: "Dla odpowiedzi instytucji — ścieżka /publikacje/nazwa-wpisu/", widget: string, required: false, i18n: duplicate }
      - { name: data_odpowiedzi, label: Data odpowiedzi, widget: string, required: false, i18n: duplicate }
      - { name: aliases, label: Stare adresy (aliasy), widget: list, required: false, i18n: true }
      - name: title
        label: Tytuł
        widget: string
        i18n: true
      - { name: description, label: Opis (lead i meta), widget: text, required: false, i18n: true }
      - { name: date, label: Data publikacji, widget: datetime, date_format: YYYY-MM-DD, time_format: false, i18n: duplicate }
      - { name: lastmod, label: Data aktualizacji, widget: datetime, required: false, date_format: YYYY-MM-DD, time_format: false, i18n: duplicate }
      - name: tematy
        label: Tematy
        widget: select
        multiple: true
        required: false
        i18n: duplicate
        options: {{ hugo.Data.navigation.topics.publikacje | jsonify }}
      - name: instytucje
        label: Instytucje
        widget: tagi
        required: false
        i18n: duplicate
        options: [{{ $t := slice }}{{ range hugo.Sites }}{{ range .RegularPages }}{{ range .Params.instytucje }}{{ $t = $t | append . }}{{ end }}{{ end }}{{ end }}{{ $t = uniq (sort $t) }}{{ range $i, $v := $t }}{{ if $i }}, {{ end }}{{ $v | jsonify }}{{ end }}]
      - name: lata
        label: Lata
        widget: tagi
        required: false
        i18n: duplicate
        options: [{{ $t := slice }}{{ range hugo.Sites }}{{ range .RegularPages }}{{ range .Params.lata }}{{ $t = $t | append . }}{{ end }}{{ end }}{{ end }}{{ $t = uniq (sort $t) }}{{ range $i, $v := $t }}{{ if $i }}, {{ end }}{{ $v | jsonify }}{{ end }}]
      - { name: data_wyslania, label: Data wysłania, widget: string, required: false, i18n: duplicate }
      - { name: sygnatura, label: Sygnatura, widget: string, required: false, i18n: duplicate }
      - { name: termin, label: Termin, widget: string, required: false, i18n: duplicate }
      - { name: zrodlo, label: Źródło (adres), widget: string, required: false, i18n: duplicate }
      - { name: autor, label: Autor, widget: string, required: false, default: Zespół Tu Żyjemy, i18n: duplicate }
      - { name: body, label: Treść, widget: markdown, i18n: true }

  - name: wzory
    label: Poradniki i wzory — wzory
    label_singular: Wzory pism
    publish: false
    folder: content/wzory
    create: true
    i18n: true
    slug: '{{ $SLUG }}'
    fields:
      - name: title
        label: Tytuł
        widget: string
        i18n: true
      - { name: description, label: Opis (lead i meta), widget: text, required: false, i18n: true }
      - { name: date, label: Data publikacji, widget: datetime, date_format: YYYY-MM-DD, time_format: false, i18n: duplicate }
      - { name: lastmod, label: Data aktualizacji, widget: datetime, required: false, date_format: YYYY-MM-DD, time_format: false, i18n: duplicate }
      - name: tematy
        label: Tematy
        widget: select
        multiple: true
        required: false
        i18n: duplicate
        options: {{ hugo.Data.navigation.topics.pomoc | jsonify }}
      - name: instytucje
        label: Instytucje
        widget: tagi
        required: false
        i18n: duplicate
        options: [{{ $t := slice }}{{ range hugo.Sites }}{{ range .RegularPages }}{{ range .Params.instytucje }}{{ $t = $t | append . }}{{ end }}{{ end }}{{ end }}{{ $t = uniq (sort $t) }}{{ range $i, $v := $t }}{{ if $i }}, {{ end }}{{ $v | jsonify }}{{ end }}]
      - name: lata
        label: Lata
        widget: tagi
        required: false
        i18n: duplicate
        options: [{{ $t := slice }}{{ range hugo.Sites }}{{ range .RegularPages }}{{ range .Params.lata }}{{ $t = $t | append . }}{{ end }}{{ end }}{{ end }}{{ $t = uniq (sort $t) }}{{ range $i, $v := $t }}{{ if $i }}, {{ end }}{{ $v | jsonify }}{{ end }}]
      - { name: wzor, label: To wzór pisma, widget: boolean, required: false, default: true, i18n: duplicate }
      - { name: uwaga_prawna, label: Pokaż zastrzeżenie prawne, widget: boolean, required: false, default: true, i18n: duplicate }
      - { name: autor, label: Autor, widget: string, required: false, default: Zespół Tu Żyjemy, i18n: duplicate }
      - { name: body, label: Treść, widget: markdown, i18n: true }

  - name: poradniki
    label: Poradniki i wzory — poradniki
    label_singular: Poradniki
    publish: false
    folder: content/poradniki
    create: true
    i18n: true
    slug: '{{ $SLUG }}'
    fields:
      - name: title
        label: Tytuł
        widget: string
        i18n: true
      - { name: description, label: Opis (lead i meta), widget: text, required: false, i18n: true }
      - { name: date, label: Data publikacji, widget: datetime, date_format: YYYY-MM-DD, time_format: false, i18n: duplicate }
      - name: tematy
        label: Tematy
        widget: select
        multiple: true
        required: false
        i18n: duplicate
        options: {{ hugo.Data.navigation.topics.pomoc | jsonify }}
      - name: instytucje
        label: Instytucje
        widget: tagi
        required: false
        i18n: duplicate
        options: [{{ $t := slice }}{{ range hugo.Sites }}{{ range .RegularPages }}{{ range .Params.instytucje }}{{ $t = $t | append . }}{{ end }}{{ end }}{{ end }}{{ $t = uniq (sort $t) }}{{ range $i, $v := $t }}{{ if $i }}, {{ end }}{{ $v | jsonify }}{{ end }}]
      - name: lata
        label: Lata
        widget: tagi
        required: false
        i18n: duplicate
        options: [{{ $t := slice }}{{ range hugo.Sites }}{{ range .RegularPages }}{{ range .Params.lata }}{{ $t = $t | append . }}{{ end }}{{ end }}{{ end }}{{ $t = uniq (sort $t) }}{{ range $i, $v := $t }}{{ if $i }}, {{ end }}{{ $v | jsonify }}{{ end }}]
      - { name: uwaga_prawna, label: Pokaż zastrzeżenie prawne, widget: boolean, required: false, default: true, i18n: duplicate }
      - { name: autor, label: Autor, widget: string, required: false, default: Zespół Tu Żyjemy, i18n: duplicate }
      - { name: body, label: Treść, widget: markdown, i18n: true }
